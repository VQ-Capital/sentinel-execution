# ========== DOSYA: sentinel-execution/Cargo.toml ==========
[package]
name = "sentinel-execution"
version = "0.9.7"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
async-nats = "0.34"
prost = "0.12"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
uuid = { version = "1.7", features = ["v4"] }

# 🔥 CERRAHİ: Core kütüphanesi eklendi (RiskEngine buradan beslenecek)
sentinel-core = { path = "../sentinel-core" }

[build-dependencies]
prost-build = "0.12"